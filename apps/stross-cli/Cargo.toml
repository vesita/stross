[package]
name = "stross-cli"
description = "Stross command-line tool: relay / serve / ctrl / push / receive for headless testing and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stross"
path = "src/main.rs"

[dependencies]
stross-kernel.workspace = true
stross-view.workspace = true
stross-bridge.workspace = true
stross-endpoint.workspace = true
stross-proto.workspace = true
# 广播发现概念 crate（P3：壳层不再经 stross_kernel::discovery 薄壳引用，
# 实现单一真源在 stross-discovery，docs/framework-v3.md §3.8）。
stross-discovery.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
hostname.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["discovery"]
# mDNS 广播 + 局域网设备发现（浏览其它中继，供 /api/peers 展示）
discovery = []

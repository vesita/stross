[package]
name = "stross-transport"
description = "Pluggable transport layer for Stross: WS / WebRTC / in-memory (design docs/plugin-architecture.md §4)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-proto.workspace = true
stross-types.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
futures-util.workspace = true
local-ip-address.workspace = true
mdns = { workspace = true, optional = true }
tokio-tungstenite.workspace = true
tungstenite.workspace = true
# 纯 Rust WebRTC（MIT/Apache-2.0）；rust-crypto 后端避免 C 构建依赖
str0m.workspace = true
# 纯 Rust SRT（MIT/Apache-2.0，TSBPD/ARQ/HaiCrypt，零 C 依赖）
rsrt.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true

[features]
default = []
# 启用 mDNS 候选解析（浏览器 WebRTC 的 .local 主机名；随 stross-core 的 discovery 传递）
discovery = ["dep:mdns"]

[dev-dependencies]
tracing-subscriber.workspace = true

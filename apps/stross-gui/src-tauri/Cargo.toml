[package]
name = "stross-gui"
description = "Stross 推流端（Tauri 桌面 + Android）"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "stross_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri.workspace = true
stross-app = { path = "../../../crates/stross-app", version = "0.1.0" }
stross-media = { path = "../../../crates/stross-media", version = "0.1.0" }
stross-core = { path = "../../../crates/stross-core", version = "0.1.0", features = ["discovery"] }
stross-proto = { path = "../../../crates/stross-proto", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
# Android 播放桥：Kotlin PlaybackPlugin 直调 Rust 导出函数（YUV→RGBA、缩放、
# 事件规整在 Rust 侧完成，Java 只留 MediaCodec 薄壳）。仅 Android 目标编译。
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

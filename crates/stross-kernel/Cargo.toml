[package]
name = "stross-kernel"
description = "Kernel for Stross: platform-neutral services — relay (data plane), discovery, negotiation, control plane, subscription, file transfer, endpoint/session/routing, push/receive orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-proto.workspace = true
stross-view.workspace = true
stross-transport.workspace = true
stross-endpoint.workspace = true
# v3 概念契约 crate（P1 建，P2d 内核实现）：共享 / 订阅两端编排契约——
# 依赖方向 kernel → 契约 crate 单向（契约 crate 只放 trait 与纯类型，
# 实现放内核 impl，见 docs/framework-v3.md §3.3/§3.4）。
stross-share.workspace = true
stross-subscribe.workspace = true
# v3 概念 crate：节点 = 端点插件宿主（Node trait + NodeInfo/NodeRole/TransportAddr；
# v3.1 V1 激活，kernel graph.rs 类型统一转发自此，docs/framework-v3.md §10.4）。
stross-node.workspace = true
# v3 概念 crate：pick 规则层（解读/缓冲/注册表）与序列化装载（Loader/loader_for）、
# 广播发现（mDNS/子网扫描实现，P2b 迁出自本 crate discovery/ 模块）。
stross-pick.workspace = true
stross-serialize.workspace = true
stross-discovery.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
# 一次性凭证 PIN 随机数（非密码学；fastrand 已在工作区，避免引入 rand 家族新依赖）。
fastrand.workspace = true
# 内核 id 新类型底层小字符串（见 kernel/id.rs）。
smol_str.workspace = true
axum.workspace = true
reqwest.workspace = true
# QUIC 链路 peer 循环（通信模式 v2 Phase C 连接复用：中继侧按 quinn 流类型
# 驱动媒体流收发；传输层 stross-transport 仍是 QUIC 的实现属主）。
quinn.workspace = true
# axum_extras：在 api.rs 用 #[utoipa::path] 直接解析 axum 处理器签名。
utoipa = { workspace = true, features = ["axum_extras"] }
# 中继 / 协商端点挂 /docs（swagger-ui）。
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

[features]
# mDNS 服务发现默认开启（内核自身含浏览/广播消费方：scan_lan / 引导锚定）；
# 纯粹的中继消费方可用 default-features = false 剪掉。实现本体已随 v3 P2b
# 迁至 stross-discovery（kernel 非可选依赖）；本 feature 仅裁剪内核内的
# 消费点（peers 周期浏览 / 中继广播 / 壳层 discovery 薄壳）与
# stross-transport 的 mDNS 解析能力。
default = ["discovery"]
discovery = ["stross-transport/discovery"]

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
str0m.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true
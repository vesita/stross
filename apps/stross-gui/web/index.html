<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Stross 串流器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 内联 SVG 图标雪碧图：统一 stroke 风格线性图标（替代 emoji），
       通过 <svg class="ic"><use href="#i-xxx"/></svg> 引用。 -->

      <path d="M2 12.05A9 9 0 0 1 9.95 20" />

    </symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2" />
      <line x1="8" y1="21" x2="16" y2="21" />
      <line x1="12" y1="17" x2="12" y2="21" />
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </symbol>
    <symbol id="i-flask" viewBox="0 0 24 24">

      <path d="M6.453 15h11.094" />
      <path d="M8.5 2h7" />
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" />
      <line x1="2" y1="12" x2="22" y2="12" />
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="17 8 12 3 7 8" />
      <line x1="12" y1="3" x2="12" y2="15" />
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2" />
      <line x1="12" y1="18" x2="12.01" y2="18" />
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
      <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
      <line x1="12" y1="19" x2="12" y2="23" />
      <line x1="8" y1="23" x2="16" y2="23" />
    </symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
    </symbol>
    <symbol id="i-mute" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      <line x1="23" y1="9" x2="17" y2="15" />
      <line x1="17" y1="9" x2="23" y2="15" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <polygon points="5 3 19 12 5 21 5 3" />
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="17" height="17" rx="3" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <polyline points="23 4 23 10 17 10" />
      <polyline points="1 20 1 14 7 14" />
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
    </symbol>
    <symbol id="i-zap" viewBox="0 0 24 24">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
    </symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24">
      <line x1="22" y1="2" x2="11" y2="13" />
      <polygon points="22 2 15 22 11 13 2 9 22 2" />
    </symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24">
      <path d="M5 12.55a11 11 0 0 1 14.08 0" />
      <path d="M1.42 9a16 16 0 0 1 21.16 0" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
      <circle cx="12" cy="12" r="3" />
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24">
      <polygon points="23 7 16 12 23 17 23 7" />
      <rect x="1" y="5" width="15" height="14" rx="2" />
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path d="M9 18V5l12-2v13" />
      <circle cx="6" cy="18" r="3" />
      <circle cx="18" cy="16" r="3" />
    </symbol>
    <symbol id="i-server" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="8" rx="2" />
      <rect x="2" y="14" width="20" height="8" rx="2" />
      <line x1="6" y1="6" x2="6.01" y2="6" />
      <line x1="6" y1="18" x2="6.01" y2="18" />
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2" />
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
    </symbol>
    <symbol id="i-radio" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="2" />
      <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
    </symbol>
    <symbol id="i-activity" viewBox="0 0 24 24">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
    </symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24">
      <path d="M8 3H5a2 2 0 0 0-2 2v3" />
      <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
      <path d="M3 16v3a2 2 0 0 0 2 2h3" />
      <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
    </symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24">
      <path d="M8 3v3a2 2 0 0 1-2 2H3" />
      <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
      <path d="M3 16h3a2 2 0 0 1 2 2v3" />
      <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
    </symbol>
  </svg>

  <header>
    <div class="brand">
      <span class="logo-mark">
        <svg class="ic"><use href="#i-logo" /></svg>
      </span>
      <div>
        <h1>Stross</h1>
        <span class="subtitle">局域网设备共享</span>
      </div>
    </div>
    <div class="header-right">
      <label class="disco-toggle" title="可被发现：开启后局域网其它设备经 mDNS 扫描到本机">
        <span class="disco-label">可被发现</span>
        <input id="disco-toggle" type="checkbox" />
        <span class="disco-track"><span class="disco-thumb"></span></span>
      </label>
      <span id="anchor-badge" class="badge">锚定中…</span>
      <span id="ffmpeg-badge" class="badge">检查 ffmpeg…</span>
      <span id="ver-badge" class="badge muted">v-</span>
    </div>
  </header>

  <main>
    <div id="error-box" class="error hidden"></div>

    <!-- ============ 设备（通告/订阅） × 接收 ============
         组织方式：节点 → 设备 → 端点。左栏「设备」：本机设备树（通告为可订阅端点）
         + 局域网设备目录（订阅对端端点）；右栏「接收」：订阅进来的流在此播放/停止。 -->
    <div class="dual">
      <!-- ── 左栏：设备 ── -->
      <section class="card" id="device-pane">
        <div class="pane-head">
          <h2>设备</h2>
          <div class="row pane-tools">
            <button id="scan-btn" type="button">
              <svg class="ic"><use href="#i-search" /></svg><span>扫描</span>
            </button>
            <input id="manual-addr" type="text" placeholder="http://ip:port（手动添加）" />
            <button id="manual-add-btn" type="button">添加</button>
          </div>
        </div>
        <div id="grid-error" class="error hidden"></div>
        <!-- 防火墙自动放行（权限自动化）：检测到 ufw 入站拦截 Stross 端口时提示一键放行 -->
        <div id="fw-banner" class="fw-banner hidden">
          <div class="fw-banner-text">
            <svg class="ic"><use href="#i-zap" /></svg>
            <span>跨设备共享会被防火墙拦截，缺少放行：<b id="fw-missing"></b></span>
          </div>
          <div class="row">
            <button id="fw-allow-btn" class="primary sm" type="button">
              <svg class="ic"><use href="#i-check" /></svg><span>一键放行</span>
            </button>
            <button id="fw-close-btn" class="sm" type="button">忽略</button>
          </div>
        </div>
        <!-- 本机卡片（设备树：通告/取消通告）+ 局域网设备卡片（目录：订阅端点） -->
        <div id="device-list"></div>
        <div id="recent-block" class="hidden">
          <h2>手动添加历史</h2>
          <ul id="recent-list" class="url-list"></ul>
        </div>
      </section>

      <!-- ── 右栏：接收（订阅的端点流）── -->
      <section class="card" id="recv-pane">
        <div class="pane-head">
          <h2>接收</h2>
          <span class="hint">订阅的端点流在此播放</span>
          <button id="recv-stop-btn" class="sm hidden" type="button">
            <svg class="ic"><use href="#i-stop" /></svg><span>停止接收</span>
          </button>
        </div>
        <div id="recv-error" class="error hidden"></div>
        <!-- 接收画面：有视频帧时显示，纯音频隐藏 -->
        <div class="canvas-wrap hidden" id="recv-canvas-wrap">
          <canvas id="recv-canvas" width="640" height="360"></canvas>
          <div class="canvas-overlay hidden" id="recv-overlay">
            <span class="spinner"></span>
            <span>等待流数据…</span>
          </div>
          <!-- 播放器控制条：悬停显示；全屏时叠加在画面底部 -->
          <div class="recv-controls" id="recv-controls">
            <span class="recv-controls-info" id="recv-controls-info"></span>
            <span class="spacer"></span>
            <button id="recv-fs-btn" class="ctrl-btn" type="button" title="全屏">
              <svg class="ic"><use href="#i-maximize" /></svg>
            </button>
            <button id="recv-fs-stop-btn" class="ctrl-btn danger" type="button" title="停止接收">
              <svg class="ic"><use href="#i-stop" /></svg>
            </button>
          </div>
        </div>
        <div class="status-line hidden" id="recv-status-line">
          <span class="dot idle" id="recv-dot"></span>
          <span id="recv-status">未接收</span>
        </div>
        <div id="recv-meta" class="meta"></div>
      </section>
    </div>
  </main>

  <!-- 通告弹窗（本机设备 → 端点：可见性 / delivery 由公开者声明） -->
  <div id="pub-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="pub-modal-title">通告设备</h2>
      <p class="hint" id="pub-modal-sub"></p>
      <fieldset>
        <legend>可见性（谁可订阅）</legend>
        <label class="row check-row"><input type="radio" name="pub-vis" value="public" /><span>公开（任何人免确认）</span></label>
        <label class="row check-row"><input type="radio" name="pub-vis" value="confirm" checked /><span>需确认（首见人工允许，信任后自动）</span></label>
      </fieldset>
      <fieldset>
        <legend>数据面方向（公开者声明）</legend>
        <label class="row check-row"><input type="radio" name="pub-delivery" value="pull" checked /><span>拉取（订阅方连本机中继观看）</span></label>
        <label class="row check-row"><input type="radio" name="pub-delivery" value="push" /><span>推送（本机凭凭证推入订阅方中继）</span></label>
        <label class="row check-row"><input type="radio" name="pub-delivery" value="both" /><span>双向（订阅方可选）</span></label>
      </fieldset>
      <div class="row">
        <button id="pub-confirm-btn" class="primary" type="button">
          <svg class="ic"><use href="#i-radio" /></svg><span>通告</span>
        </button>
        <button id="pub-cancel-btn" type="button">
          <svg class="ic"><use href="#i-x" /></svg><span>取消</span>
        </button>
      </div>
      <div id="pub-error" class="error hidden"></div>
    </div>
  </div>

  <!-- 订阅弹窗（对端端点 → 本机接收：握手后走既有 start_receive） -->
  <div id="sub-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="sub-modal-title">订阅端点</h2>
      <p class="hint" id="sub-modal-sub"></p>
      <div class="row">
        <select id="sub-delivery"></select>
      </div>
      <div class="row">
        <button id="sub-confirm-btn" class="primary" type="button">
          <svg class="ic"><use href="#i-download" /></svg><span>订阅并接收</span>
        </button>
        <button id="sub-cancel-btn" type="button">
          <svg class="ic"><use href="#i-x" /></svg><span>取消</span>
        </button>
      </div>
      <div id="sub-error" class="error hidden"></div>
    </div>
  </div>

  <!-- 设备接入授权确认弹窗（电脑端：局域网设备申请共享凭证时的首次人工确认） -->
  <div id="approve-modal" class="modal hidden">
    <div class="modal-box">
      <h2>设备接入请求</h2>
      <p class="hint" id="approve-device"></p>
      <p class="hint" id="approve-media"></p>
      <label class="row check-row">
        <input type="checkbox" id="approve-remember" checked />
        <span>记住此设备（下次自动允许，不再询问）</span>
      </label>
      <div class="row">
        <button id="approve-allow-btn" class="primary" type="button">
          <svg class="ic"><use href="#i-check" /></svg><span>允许</span>
        </button>
        <button id="approve-deny-btn" type="button">
          <svg class="ic"><use href="#i-x" /></svg><span>拒绝</span>
        </button>
      </div>
      <div id="approve-status" class="meta"></div>
      <div id="approve-error" class="error hidden"></div>
    </div>
  </div>

  <!-- 前端脚本：app/ 目录按依赖序加载（script 全局作用域共享，勿改顺序；
       types.js 必须是第一个——类型/标签/字符串联合的单一真源） -->
  <script src="app/types.js"></script>
  <script src="app/state.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/discovery.js"></script>
  <script src="app/endpoints.js"></script>
  <script src="app/subscribe.js"></script>
  <script src="app/firewall.js"></script>
  <script src="app/main.js"></script>
</body>
</html>

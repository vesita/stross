[package]
name = "stross-relay"
description = "Standalone LAN streaming relay for Stross"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-kernel.workspace = true
anyhow.workspace = true
clap.workspace = true
hostname.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["discovery"]
# mDNS 广播 + 局域网设备发现（浏览其它中继，供 /api/peers 展示）
discovery = ["stross-kernel/discovery"]

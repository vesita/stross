[package]
name = "stross-gui"
description = "Stross 推流端（Tauri 桌面 + Android）"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "stross_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri.workspace = true
stross-kernel.workspace = true
stross-bridge.workspace = true
stross-endpoint.workspace = true
stross-proto.workspace = true
# 广播发现概念 crate（P3：壳层不再经 stross_kernel::discovery 薄壳引用，
# 实现单一真源在 stross-discovery，docs/framework-v3.md §3.8）。
stross-discovery.workspace = true
# 本机 IP 枚举（net::local_ips 真源在 stross-transport；壳层不再经
# stross_kernel::net 引用，docs/framework-v3.md §2.1）。
stross-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
# Android 播放桥：Kotlin PlaybackPlugin 直调 Rust 导出函数（YUV→RGBA、缩放、
# 事件规整在 Rust 侧完成，Java 只留 MediaCodec 薄壳）。仅 Android 目标编译。
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

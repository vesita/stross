[package]
name = "stross-gui"
description = "Stross 推流端（Tauri 桌面 + Android）"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "stross_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri.workspace = true
stross-app = { path = "../../../crates/stross-app", version = "0.1.0" }
stross-media = { path = "../../../crates/stross-media", version = "0.1.0" }
stross-core = { path = "../../../crates/stross-core", version = "0.1.0", features = ["discovery"] }
stross-proto = { path = "../../../crates/stross-proto", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true
base64.workspace = true

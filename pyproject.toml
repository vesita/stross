# Stross 自动化工具链（uv 管理）。
# 废弃手工 shell 脚本（scripts/*.sh、*.mjs），迁移为单一 Python 入口：
#   uv run python -m scripts <子命令> ...
# 行为等价旧脚本（docs/framework-v3.md §6 定稿）。
[project]
name = "stross-tools"
version = "0.1.0"
description = "Stross 自动化工具链（等价旧 scripts/*.sh 与 *.mjs）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stross-tools = "scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
# 无第三方依赖；保持锁文件可复现
package = true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stross 观看端</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📡</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>📡 Stross</h1>
    <span class="subtitle">局域网串流观看端</span>
    <span id="conn-state" class="badge">未连接</span>
  </header>

  <main>
    <aside id="sidebar">
      <h2>在线串流</h2>
      <div id="stream-list" class="stream-list">
        <p class="hint">正在扫描…</p>
      </div>
      <button id="refresh-btn" type="button">刷新</button>
      <details class="about">
        <summary>关于</summary>
        <p>Stross 使用 WebSocket 传输 H.264/AAC，浏览器通过 MSE 解码播放。</p>
      </details>
    </aside>

    <section id="player-pane">
      <div id="video-wrap">
        <video id="player" autoplay controls muted playsinline></video>
        <div id="placeholder" class="placeholder">
          <p>选择一个串流开始观看</p>
        </div>
      </div>
      <div id="stats" class="stats">
        <span id="st-stream">-</span>
        <span id="st-video">-</span>
        <span id="st-audio">-</span>
        <span id="st-rate">0 Kbps</span>
        <span id="st-fps">0 fps</span>
        <span id="st-latency">-</span>
      </div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="/jmuxer.js"></script>
  <script src="/app.js"></script>
</body>
</html>

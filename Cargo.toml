[workspace]
resolver = "3"
members = [
    "crates/stross-proto",
    "crates/stross-types",
    "crates/stross-transport",
    "crates/stross-kernel",
    "crates/stross-endpoint",
    "crates/stross-bridge",
    "apps/stross-relay",
    "apps/stross-cli",
    "apps/stross-gui/src-tauri",
    "crates/mdns",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Stross — a LAN streaming toolkit written in Rust"
authors = ["Stross contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio 特性裁剪：按全工作区实际用法（net/sync/time/process/fs/io/signal/
# rt/macros）取最小集，不启用 full（省编译时间与依赖面）。
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# 播放侧音频输出（桌面 PlaybackSink，D6）；Android 交叉编译可编译（AAudio/OpenSLES）
cpal = "0.18.2"

# ---------------------------------------------------------------------------
# 依赖版本统一在此管理；各 crate 一律 `xxx.workspace = true` 引用
# （optional 依赖在 crate 内补 `optional = true`，版本仍以本文件为准）。
# ---------------------------------------------------------------------------
async-trait = "0.1"
# Wayland 屏幕采集栈（linux 目标；stross-endpoint wayland-capture feature 启用）：
# lamco-pipewire = pipewire 采集（低层 API，KWin 协商 + SHM/CPU 路径），
# lamco-portal = xdg-desktop-portal ScreenCast 会话；ashpd 用于选源。
ashpd = "0.13"
lamco-pipewire = "0.6.13"
lamco-portal = "0.4.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
# mDNS（crates/mdns）依赖：版本统一在此管理，mdns 内 xxx.workspace = true
fastrand = "2.5.0"
# 内核 id 新类型底层小字符串（SBO，clone 零分配用于 ≤23 字节的短 id）。
smol_str = "0.3"
flume = { version = "0.12", default-features = false }
if-addrs = { version = "0.15", features = ["link-local"] }
mio = { version = "1.2.2", features = ["os-poll", "net"] }
socket-pktinfo = "0.4.1"
socket2 = { version = "0.6.5", features = ["all"] }
# mDNS tests 的 dev-dependency（同样统一管理）
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
humantime = "2.3"
test-log = "0.2.21"
futures-util = "0.3"
hostname = "0.4"
local-ip-address = "0.6"
memchr = "2"
quinn = "0.11"
rcgen = "0.14.10"
rsrt = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rustls = { version = "0.23", features = ["ring"] }
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
tauri = { version = "2", features = [] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
# Android 播放桥（Kotlin ⇄ Rust JNI）：只有 stross-gui 在 Android 目标使用；
# 版本与 tauri 2.11 锁定的 jni 0.21 一致，避免同一 .so 内两个 jni 版本符号冲突。
jni = "0.21"
# OpenAPI 文档（axum API 声明：dto.rs 承载 ToSchema，api.rs 用 #[utoipa::path] 声明
# 路由；服务端挂 utoipa-swagger-ui 于 /docs）。版本统一在此；axum_extras 等特性
# 由使用它的 crate 在成员依赖里补（proto 只用默认 macros 拿 ToSchema）。
utoipa = "5.5"
utoipa-swagger-ui = "9"

# ---------------------------------------------------------------------------
# 工作区内部 crate：路径/版本统一在此；成员一律 `xxx.workspace = true` 引用
# （需要开启 feature 的成员可写 `xxx = { workspace = true, features = [...] }`）。
# ---------------------------------------------------------------------------
stross-proto = { path = "crates/stross-proto", version = "0.2.0" }
stross-types = { path = "crates/stross-types", version = "0.2.0" }
stross-transport = { path = "crates/stross-transport", version = "0.2.0" }
stross-kernel = { path = "crates/stross-kernel", version = "0.2.0" }
stross-endpoint = { path = "crates/stross-endpoint", version = "0.2.0" }
stross-bridge = { path = "crates/stross-bridge", version = "0.2.0" }

# mDNS 服务发现：fork 自 mdns-sd 0.21（crates/mdns），本地维护以修跨设备
# 发现（SO_REUSEPORT 端口竞争等）上游未覆盖的问题。
mdns = { path = "crates/mdns" }

[profile.release]
codegen-units = 1
lto = true
strip = true

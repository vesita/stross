[package]
name = "stross-media"
description = "System adaptation layer for Stross: capture pipelines (ffmpeg), device enumeration, stream parsing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true

# cpal 仅在非 Android 目标启用：Android 播放走 Kotlin MediaCodec（1f-3），
# cpal-android 会链接 -laaudio（NDK 27 无独立 aaudio 库导致交叉编译失败）。
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

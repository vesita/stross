[package]
name = "stross-relay"
description = "Standalone LAN streaming relay for Stross"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-core = { path = "../../crates/stross-core", version = "0.1.0" }
stross-proto = { path = "../../crates/stross-proto", version = "0.1.0" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# 启用 mDNS 广播（`--advertise` 参数依赖此特性）
discovery = ["stross-core/discovery"]

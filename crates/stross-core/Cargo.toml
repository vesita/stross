[package]
name = "stross-core"
description = "Core LAN sharing library for Stross: relay server, push client, discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-proto = { path = "../stross-proto", version = "0.1.0" }
stross-transport = { path = "../stross-transport", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
axum.workspace = true
hostname.workspace = true
mdns-sd = { workspace = true, optional = true }

[features]
default = []
# 启用 mDNS 服务发现（局域网自动发现中继/推流端）；同时传递到传输层
# （WebRTC 的 .local 候选解析）
discovery = ["dep:mdns-sd", "stross-transport/discovery"]

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
# WebRTC 集成测试客户端（webrtc_watch.rs 直接使用 str0m 对端）
str0m.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true

[package]
name = "stross-core"
description = "Core LAN sharing library for Stross: relay server, push client, discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stross-proto = { path = "../stross-proto", version = "0.1.0" }
stross-transport = { path = "../stross-transport", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["ws"] }
hostname = "0.4"
mdns-sd = { version = "0.13", optional = true }

[features]
default = []
# 启用 mDNS 服务发现（局域网自动发现中继/推流端）；同时传递到传输层
# （WebRTC 的 .local 候选解析）
discovery = ["dep:mdns-sd", "stross-transport/discovery"]

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.27"
tungstenite = "0.27"
# WebRTC 集成测试客户端（webrtc_watch.rs 直接使用 str0m 对端）
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing-subscriber.workspace = true

[workspace]
resolver = "3"
members = [
    "crates/stross-proto",
    "crates/stross-transport",
    "crates/stross-core",
    "crates/stross-media",
    "crates/stross-app",
    "apps/stross-relay",
    "apps/stross-sender/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Stross — a LAN streaming toolkit written in Rust"
authors = ["Stross contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
